
name: Auto Dealer CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: auto_dealer_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auto_dealer_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Auto-Dealer

    env:
      DB_URL: jdbc:postgresql://localhost:5432/auto_dealer_db
      DB_USERNAME: postgres
      DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: Auto-Dealer/pom.xml

      - name: Build and run tests
        run: chmod +x mvnw && ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build -t auto-dealer-app:latest .

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: Auto-Dealer
          format: table
          exit-code: "0"
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: auto-dealer-app:latest
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
